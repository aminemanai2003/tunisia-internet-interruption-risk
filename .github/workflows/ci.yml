name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: python -m compileall -q scripts
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libglpk-dev libx11-dev
      - uses: r-lib/actions/setup-renv@v2
      - run: Rscript tests/testthat.R
      - run: Rscript scripts/check_public_release.R
      - run: quarto render --to html
