[project]
name = "tunisia-internet-interruption-risk"
version = "0.1.0"
description = "Public network context collection and governed ML validation for an actuarial internet-interruption study."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "requests>=2.32",
  "scikit-learn>=1.7",
  "truststore>=0.10; platform_system == 'Windows'",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"
